name: Publish Daggerlight Phaser Preview

on:
  push:
    branches: ["prototype/phaser-v1"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daggerlight-phaser-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phaser workstream
        uses: actions/checkout@v4
        with:
          ref: prototype/phaser-v1
          path: source
      - name: Checkout public site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: source
        run: npm install
      - name: Verify desktop and mobile layout hit zones
        working-directory: source
        run: npx vitest run phaser/layout.test.ts
      - name: Build Phaser preview
        working-directory: source
        run: npm run build:phaser
      - name: Install Chromium for real-browser smoke testing
        working-directory: source
        run: npx playwright install --with-deps chromium
      - name: Verify canvas render in desktop and portrait browsers
        timeout-minutes: 3
        working-directory: source
        run: npm run test:phaser:smoke
      - name: Copy Phaser preview ONLY
        run: |
          rm -rf site/gameplay-phaser
          mkdir -p site/gameplay-phaser
          cp -R source/dist-phaser/. site/gameplay-phaser/
          # Real rendered screenshots for visual regression review, not mockups.
          cp source/phaser-desktop.png site/gameplay-phaser/_preview-desktop.png
          cp source/phaser-mobile.png site/gameplay-phaser/_preview-mobile.png
      - name: Publish isolated Phaser site
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --mixed origin/main
            git add -A gameplay-phaser
            if git diff --cached --name-only | grep -E '^gameplay-v1(/|-lab/)'; then
              echo "Refusing to modify classic or LAB."
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "No Phaser changes."
              exit 0
            fi
            git commit -m "Update independent Daggerlight Phaser preview"
            if git push origin HEAD:main; then
              echo "Published Phaser without touching classic or LAB."
              exit 0
            fi
          done
          exit 1
      - name: Trigger GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches \
            -d '{"ref":"main"}'
