name: Validate and publish Daggerlight Animation Lab v4 preview

on:
  push:
    branches: ["feature/animation-lab-v4"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daggerlight-animation-lab-v4-preview
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated redesign branch
        uses: actions/checkout@v4
        with:
          ref: feature/animation-lab-v4
          path: board-source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: board-source
        run: npm install

      - name: Test Daggerlight game and animation lab
        working-directory: board-source
        run: npm test

      - name: Build standalone animation lab preview
        working-directory: board-source
        run: npm run build

      - name: Install headless Chromium for visual smoke test
        working-directory: board-source
        run: npx playwright install --with-deps --only-shell chromium

      - name: Browser-play all thirteen Animation Lab demonstrations
        working-directory: board-source
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/daggerlight-lab-vite.log 2>&1 &
          node scripts/animation-lab-smoke.mjs

      - name: Upload Animation Lab screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daggerlight-animation-lab-browser-check
          path: /tmp/daggerlight-animation-lab-smoke.png
          if-no-files-found: ignore

      - name: Checkout main site for separately scoped preview
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy ONLY the experimental board preview
        run: |
          rm -rf site/animation-lab-v4
          mkdir -p site/animation-lab-v4
          cp -R board-source/dist/. site/animation-lab-v4/

      - name: Commit only preview folder, preserving original gameplay
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --mixed origin/main
            git add -A animation-lab-v4
            if git diff --cached --name-only | grep -E '^(gameplay-v1|gameplay-v1-lab|ui-v2)/'; then
              echo "Refusing changes outside the isolated board preview."
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "Preview is already published."
              exit 0
            fi
            git commit -m "Update experimental hybrid gameboard preview"
            if git push origin HEAD:main; then
              echo "Published animation-lab-v4 without replacing the playable client."
              exit 0
            fi
          done
          exit 1

      - name: Trigger Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches \
            -d '{"ref":"main"}'
