name: AI difficulty v2 experiment
on:
  push:
    branches: ["experiment/ai-calibration-v2"]
    paths:
      - scripts/calibrate-ai-experiment-v2.ts
      - .github/workflows/calibrate-ai-experiment-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-calibration-v2-experiment
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/ai-calibration-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Run matched 10,800 difficulty comparison
        env:
          DIFFICULTY_MATCHES_PER_CHAMPION: 400
        run: ./node_modules/.bin/vite-node scripts/calibrate-ai-experiment-v2.ts
      - uses: actions/upload-artifact@v4
        with:
          name: ai-calibration-experiment-v2
          path: reports/ai-difficulty-experiment-v2/
          retention-days: 90
      - name: Commit experimental results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ai-difficulty-experiment-v2/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record difficulty v2 experiment"
          git pull --rebase origin experiment/ai-calibration-v2
          git push origin HEAD:experiment/ai-calibration-v2
