name: Daggerlight 1.0 branch validation
on:
  push:
    branches: ["feature/daggerlight-1.0"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: daggerlight-1-0-validate
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build production candidate
        run: npm run build
      - name: Install Chromium for layout and interaction QA
        run: npx playwright install --with-deps --only-shell chromium
      - name: Start preview for browser QA
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/daggerlight-loadout-vite.log 2>&1 &
      - name: Check real desktop and mobile deck workflows before publishing
        run: node scripts/deck-library-smoke.mjs
      - name: Preserve visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daggerlight-1-0-preview-screens
          path: /tmp/daggerlight-deck-*.png
          if-no-files-found: ignore

      - name: Checkout published site on main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage only the isolated 1.0 beta folder
        run: |
          rm -rf site/daggerlight-1-0-beta
          mkdir -p site/daggerlight-1-0-beta
          cp -R dist/. site/daggerlight-1-0-beta/
      - name: Publish isolated beta without modifying the public game
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --mixed origin/main
            git add -A daggerlight-1-0-beta
            if git diff --cached --name-only | grep -Ev '^daggerlight-1-0-beta/'; then
              echo "Blocked: staged changes outside the beta folder."
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "Beta files already published."
              exit 0
            fi
            git commit -m "Update isolated Daggerlight 1.0 beta"
            if git push origin HEAD:main; then
              echo "Published beta folder without changing the live entry point."
              exit 0
            fi
          done
          exit 1

      - name: Trigger Pages publication (GITHUB_TOKEN pushes do not trigger workflows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches \
            -d '{"ref":"main"}'
