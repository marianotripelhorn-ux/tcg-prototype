name: Daggerlight 1.0 branch validation
on:
  push:
    branches: ["feature/daggerlight-1.0"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daggerlight-1-0-validate
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build production candidate
        run: npm run build
