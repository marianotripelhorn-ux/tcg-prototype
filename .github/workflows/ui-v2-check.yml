name: UI v2 build check

on:
  push:
    branches: ["ui-v2"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run engine tests
        run: npm test
      - name: Build UI v2
        run: npm run build
