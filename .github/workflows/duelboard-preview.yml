name: Publish Daggerlight HTML Duelboard Preview

on:
  push:
    branches: ["prototype/duelboard-html-v1"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daggerlight-html-duelboard
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experimental HTML board
        uses: actions/checkout@v4
        with:
          ref: prototype/duelboard-html-v1
          path: source
      - name: Checkout published website
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: source
        run: npm install --no-audit --no-fund
      - name: Compile and build HTML board
        working-directory: source
        run: npm run build:duelboard
      - name: Install Chromium for browser tests
        working-directory: source
        run: npx playwright install --with-deps chromium
      - name: Verify gameplay and drag on desktop and mobile
        timeout-minutes: 4
        working-directory: source
        run: npm run test:duelboard:smoke
      - name: Stage duelboard preview ONLY
        run: |
          rm -rf site/gameplay-duelboard
          mkdir -p site/gameplay-duelboard
          cp -R source/dist-duelboard/. site/gameplay-duelboard/
          cp source/duelboard-desktop.jpg site/gameplay-duelboard/_preview-desktop.jpg
          cp source/duelboard-mobile.jpg site/gameplay-duelboard/_preview-mobile.jpg
          cp source/duelboard-flight-desktop.jpg site/gameplay-duelboard/_preview-flight-desktop.jpg
          cp source/duelboard-flight-mobile.jpg site/gameplay-duelboard/_preview-flight-mobile.jpg
      - name: Publish isolated HTML board
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --mixed origin/main
            git add -A gameplay-duelboard
            if git diff --cached --name-only | grep -E '^(gameplay-v1/|gameplay-v1-lab/|gameplay-phaser/)'; then
              echo "Refusing to modify established game variants."
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "No duelboard changes to publish."
              exit 0
            fi
            git commit -m "Publish isolated Daggerlight HTML duelboard"
            if git push origin HEAD:main; then
              echo "HTML duelboard published; original versions untouched."
              exit 0
            fi
          done
          exit 1
      - name: Trigger GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches \
            -d '{"ref":"main"}'
