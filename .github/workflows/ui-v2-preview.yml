name: Publish UI v2 preview

on:
  push:
    branches: ["ui-v2"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ui-v2-preview
  cancel-in-progress: true

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UI v2 source
        uses: actions/checkout@v4
        with:
          ref: ui-v2
          path: ui-source

      - name: Checkout main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install UI dependencies
        working-directory: ui-source
        run: npm install

      - name: Build UI v2
        working-directory: ui-source
        run: npm run build

      - name: Copy preview into main
        run: |
          rm -rf site/ui-v2
          mkdir -p site/ui-v2
          cp -R ui-source/dist/. site/ui-v2/

      - name: Commit preview snapshot
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-v2
          if git diff --cached --quiet; then
            echo "No preview changes to publish."
            exit 0
          fi
          git commit -m "Update UI v2 preview"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Trigger Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches \
            -d '{"ref":"main"}'
