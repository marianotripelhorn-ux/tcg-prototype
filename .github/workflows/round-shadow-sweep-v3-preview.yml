name: Validate and publish Daggerlight Round Shadow Sweep v3 preview

on:
  push:
    branches: ["feature/round-archive-shadow-sweep-v3"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daggerlight-grouped-motion-validation
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated redesign branch
        uses: actions/checkout@v4
        with:
          ref: feature/round-archive-shadow-sweep-v3
          path: board-source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: board-source
        run: npm install

      - name: Test the original Daggerlight game engine
        working-directory: board-source
        run: npm test

      - name: Build playable Daggerlight grouped-motion preview
        working-directory: board-source
        env:
          VITE_GAME_VERSION: round-shadow-sweep-v3@${{ github.sha }}
        run: npm run build

      - name: Install Chromium for genuine match smoke test
        working-directory: board-source
        run: npx playwright install --with-deps --only-shell chromium

      - name: Browser-play real desktop and mobile AI matches through all three grouped stingers
        working-directory: board-source
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/daggerlight-board-gs-vite.log 2>&1 &
          node scripts/stinger-motion-smoke.mjs

      - name: Upload playable board screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daggerlight-round-shadow-sweep-v3-browser-check
          path: /tmp/daggerlight-round-shadow-sweep-v3-*.png
          if-no-files-found: ignore

      - name: Checkout main site for separately scoped preview
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy ONLY the experimental board preview
        run: |
          rm -rf site/round-shadow-sweep-v3
          mkdir -p site/round-shadow-sweep-v3
          cp -R board-source/dist/. site/round-shadow-sweep-v3/

      - name: Commit only preview folder, preserving original gameplay
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --mixed origin/main
            git add -A round-shadow-sweep-v3
            if git diff --cached --name-only | grep -E '^(gameplay-v1|gameplay-v1-lab|ui-v2)/'; then
              echo "Refusing changes outside the isolated board preview."
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "Preview is already published."
              exit 0
            fi
            git commit -m "Update isolated Round & Archive choreography preview"
            if git push origin HEAD:main; then
              echo "Published round-shadow-sweep-v3 without replacing the playable client."
              exit 0
            fi
          done
          exit 1

      - name: Trigger Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches \
            -d '{"ref":"main"}'
