name: Publish Daggerlight Classic

on:
  push:
    branches: ["prototype/classic"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daggerlight-classic
  cancel-in-progress: true

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gameplay prototype source
        uses: actions/checkout@v4
        with:
          ref: prototype/classic
          path: gameplay-source

      - name: Checkout main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install gameplay dependencies
        working-directory: gameplay-source
        run: npm install

      - name: Run engine and UI data tests
        working-directory: gameplay-source
        run: npm test

      - name: Verify PvP backend can compile without deployment
        working-directory: gameplay-source/pvp-worker
        run: |
          npm install
          npm run check
          npx wrangler deploy --dry-run --outdir .wrangler-build

      - name: Build gameplay prototype
        working-directory: gameplay-source
        env:
          # Optional public PostHog project key and host; blank means local-only.
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          VITE_PVP_API_URL: ${{ vars.PVP_API_URL }}
        run: npm run build

      - name: Copy classic build into main
        run: |
          rm -rf site/gameplay-v1
          mkdir -p site/gameplay-v1
          cp -R gameplay-source/dist/. site/gameplay-v1/

      - name: Commit preview snapshot
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebuild the commit from the latest main if another workflow
          # publishes at the same time. Never force-push site content.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --mixed origin/main
            git add -A gameplay-v1
            # Protect the experimental URL: classic publishes only gameplay-v1.
            if git diff --cached --name-only | grep -E '^gameplay-v1-lab/'; then
              echo "Refusing to modify the experimental laboratory."
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "No preview changes to publish."
              exit 0
            fi
            git commit -m "Update stable Daggerlight Classic"
            if git push origin HEAD:main; then
              echo "Published Daggerlight Classic without touching the experimental lab."
              exit 0
            fi
            echo "Main changed during publish (attempt ${attempt}); rebasing preview on latest snapshot."
          done
          echo "Could not publish after 5 attempts."
          exit 1

      - name: Trigger Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches \
            -d '{"ref":"main"}'
